{% if recipes.has_other_pages %}
  <div class="container pagination">
    <div class="pagination-content">
      <div class="pagination-content">
        {% for page in numeros  %}
         {% if page == recipes.number or page == recipes.paginator.ELLIPSIS %}
            <span class="page-link page-item page-current">{{ page }}</span>
         {% else %}
            <a class="page-link page-item" href="?page={{ page }}{{ search_pag }}">{{ page }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </div>
{% endif %}
